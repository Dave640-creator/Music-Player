name: smart_music_player
description: A smart offline music player with analytics, organization, mood playlists, and gamification.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  sqflite: ^2.3.3
  path: ^1.9.0

  # File & Storage
  path_provider: ^2.1.3
  file_picker: ^8.0.7
  permission_handler: ^11.3.1

  # Audio Playback
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  audio_session: ^0.1.21

  # State Management
  provider: ^6.1.2

  # Charts & UI
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
